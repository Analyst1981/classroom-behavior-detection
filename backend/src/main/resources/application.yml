server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  max-http-request-header-size: 64KB
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: classroom-behavior-backend
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 1024MB
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/classroom_behavior?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai

# ===== AI 推理服务（Flask + PyTorch）=====
ai:
  base-url: http://127.0.0.1:5000
  connect-timeout-ms: 20000
  read-timeout-ms: 120000
  # 结果文件访问前缀（AI 服务静态目录），前端经后端代理或直接访问
  static-prefix: /static/outputs

# ===== 本地文件保存目录（可选：把检测结果同步落盘到后端）=====
storage:
  dir: ./storage

logging:
  level:
    root: INFO
    com.cbd: INFO

---
# H2 兜底配置：MySQL 未就绪时使用
# 启动：mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/classroom-h2;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
